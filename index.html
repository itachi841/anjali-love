<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Anjali ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:"Segoe UI",Arial,sans-serif;
    color:white;

    background:
        radial-gradient(circle at 15% 15%,rgba(255,255,255,.12),transparent 25%),
        radial-gradient(circle at 85% 85%,rgba(255,80,170,.20),transparent 30%),
        linear-gradient(135deg,#140019,#39052f,#750c45,#1c001e);
}

/* =========================
   BACKGROUND
========================= */

#particles{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
}

.sparkle{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:white;
    animation:sparkle 3s infinite ease-in-out;
}

@keyframes sparkle{
    0%,100%{
        opacity:0;
        transform:scale(.2);
    }

    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

.float-heart{
    position:absolute;
    bottom:-60px;
    animation:floatUp linear forwards;
    opacity:.8;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    100%{
        transform:translateY(-115vh) rotate(360deg);
        opacity:0;
    }
}

/* =========================
   MUSIC
========================= */

.music{
    position:fixed;
    top:18px;
    right:18px;
    z-index:100;

    padding:11px 18px;

    border:1px solid rgba(255,255,255,.25);
    border-radius:30px;

    color:white;
    background:rgba(255,255,255,.12);

    backdrop-filter:blur(12px);

    cursor:pointer;

    transition:.3s;
}

.music:hover{
    transform:scale(1.05);
}

/* =========================
   CONTAINER
========================= */

.container{
    position:relative;
    z-index:2;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:80px 15px 30px;
}

/* =========================
   CARD
========================= */

.card{
    width:100%;
    max-width:570px;

    padding:42px 30px;

    text-align:center;

    border-radius:30px;

    border:1px solid rgba(255,255,255,.18);

    background:rgba(255,255,255,.09);

    backdrop-filter:blur(20px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);

    animation:appear .8s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(30px) scale(.95);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* =========================
   HEART
========================= */

.heart{
    font-size:70px;

    animation:heartbeat 1.2s infinite;
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }
}

/* =========================
   TEXT
========================= */

h1{
    margin:18px 0;

    font-size:34px;

    text-shadow:
        0 0 25px rgba(255,100,180,.7);
}

h2{
    margin:15px 0;
    color:#ffd6e8;
}

p{
    margin:12px 0;

    color:#f9dce9;

    font-size:18px;

    line-height:1.8;
}

.typing{
    min-height:75px;

    color:#ffe6f0;

    font-size:19px;

    line-height:1.7;
}

.cursor{
    display:inline-block;

    width:2px;
    height:20px;

    margin-left:3px;

    background:white;

    animation:blink .7s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

/* =========================
   BUTTONS
========================= */

.buttons{
    margin-top:28px;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.yes,
.next,
.surprise{

    border:none;

    border-radius:40px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff3d81,
            #ff76a8
        );

    box-shadow:
        0 10px 30px rgba(255,50,130,.35);

    transition:.3s;
}

.yes{
    padding:15px 34px;
    font-size:19px;
}

.no{
    margin-left:10px;

    padding:15px 28px;

    border-radius:40px;

    border:1px solid rgba(255,255,255,.2);

    color:white;

    background:rgba(255,255,255,.12);

    font-size:18px;

    transition:.3s;
}

.yes:hover,
.next:hover,
.surprise:hover{
    transform:scale(1.08);
}

.no:hover{
    transform:scale(.95);
}

.next,
.surprise{
    margin-top:25px;

    padding:15px 30px;

    font-size:18px;
}

/* =========================
   LETTER
========================= */

.letter{
    margin-top:20px;

    padding:25px;

    text-align:left;

    border-radius:22px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.12);
}

.letter p{
    margin:15px 0;
}

/* =========================
   PHOTO
========================= */

.photo-box{
    width:180px;
    height:220px;

    margin:25px auto;

    overflow:hidden;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.18);

    background:rgba(255,255,255,.08);

    box-shadow:
        0 15px 40px rgba(0,0,0,.4);
}

.photo-box img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

/* =========================
   SECRET
========================= */

.secret-input{
    width:100%;

    margin-top:20px;

    padding:15px 18px;

    outline:none;

    border:none;

    border-radius:30px;

    text-align:center;

    font-size:17px;

    background:rgba(255,255,255,.92);

    color:#4b1735;
}

.error{
    min-height:25px;

    margin-top:12px;

    color:#ffb1ca;
}

.secret-message{
    display:none;

    margin-top:22px;

    padding:22px;

    border-radius:20px;

    background:rgba(255,255,255,.08);

    animation:appear .8s ease;
}

/* =========================
   FINAL
========================= */

.final{
    font-size:22px;

    font-weight:bold;

    color:white;
}

.final-message{
    display:none;

    margin-top:25px;

    padding:25px;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,60,130,.18),
            rgba(255,255,255,.08)
        );

    border:1px solid rgba(255,255,255,.15);

    animation:appear 1s ease;
}

/* =========================
   HEART BURST
========================= */

.burst-heart{
    position:fixed;

    left:50%;
    top:50%;

    z-index:200;

    font-size:28px;

    pointer-events:none;

    transition:1.5s ease;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .container{
        padding:75px 12px 25px;
    }

    .card{
        padding:32px 20px;
        border-radius:25px;
    }

    h1{
        font-size:28px;
    }

    p{
        font-size:16px;
    }

    .heart{
        font-size:58px;
    }

    .yes,
    .no{
        display:block;

        width:90%;

        margin:12px auto;
    }

    .letter{
        padding:18px;
    }

    .music{
        top:12px;
        right:12px;

        padding:9px 14px;

        font-size:13px;
    }

    .photo-box{
        width:180px;
        height:220px;
    }
}
</style>
</head>

<body>

<!-- =========================
     PARTICLES
========================= -->

<div id="particles"></div>


<!-- =========================
     MUSIC BUTTON
========================= -->

<button
    class="music"
    id="musicBtn"
    onclick="toggleMusic()">

    🎵 Play Music

</button>


<!-- =========================
     APP
========================= -->

<div
    class="container"
    id="app">

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const app =
    document.getElementById("app");

const particles =
    document.getElementById("particles");

const musicBtn =
    document.getElementById("musicBtn");


/* =========================
   SPARKLES
========================= */

for(let i=0;i<45;i++){

    const sparkle =
        document.createElement("div");

    sparkle.className =
        "sparkle";

    sparkle.style.left =
        Math.random()*100+"%";

    sparkle.style.top =
        Math.random()*100+"%";

    sparkle.style.animationDelay =
        Math.random()*3+"s";

    particles.appendChild(sparkle);
}


/* =========================
   FLOATING HEARTS
========================= */

function createHeart(){

    const heart =
        document.createElement("div");

    heart.className =
        "float-heart";

    const hearts=[
        "❤️",
        "💗",
        "💖",
        "💕",
        "💓",
        "💞"
    ];

    heart.innerText =
        hearts[
            Math.floor(
                Math.random()*hearts.length
            )
        ];

    heart.style.left =
        Math.random()*100+"%";

    heart.style.fontSize =
        (16+Math.random()*25)+"px";

    heart.style.animationDuration =
        (6+Math.random()*6)+"s";

    particles.appendChild(heart);

    setTimeout(
        ()=>{
            heart.remove();
        },
        13000
    );
}

setInterval(
    createHeart,
    700
);


/* =========================
   TYPING EFFECT
========================= */

function typing(element,text){

    let i=0;

    function write(){

        if(i<text.length){

            element.innerHTML =
                text.substring(
                    0,
                    i+1
                )
                +
                `<span class="cursor"></span>`;

            i++;

            setTimeout(
                write,
                40
            );

        }else{

            element.innerHTML =
                text
                +
                `<span class="cursor"></span>`;
        }
    }

    write();
}


/* =========================
   HOME PAGE
========================= */

function homePage(){

    app.innerHTML=`

        <div class="card">

            <div class="heart">
                ❤️
            </div>

            <h1>
                Hey Ammayi Garu 🥺
            </h1>

            <div
                class="typing"
                id="typing">
            </div>

            <div class="buttons">

                <button
                    class="yes"
                    id="yes">

                    YES ❤️

                </button>

                <button
                    class="no"
                    id="no">

                    NO 😭

                </button>

            </div>

        </div>
    `;


    typing(
        document.getElementById("typing"),

        "I have something special to ask you... Will you stay as my special person? 🫶"
    );


    let yesSize=19;

    let count=0;


    const yes =
        document.getElementById("yes");

    const no =
        document.getElementById("no");


    const noMessages=[

        "Are you sure? 🥺",

        "Think again Ammayi Garu 😭",

        "Really? 😭",

        "Nannu ila vadileyaku 😂",

        "One more chance please 🥹",

        "Okay... YES? 🥺❤️"
    ];


    no.onclick=()=>{

        count++;

        no.innerText =
            noMessages[
                Math.min(
                    count-1,
                    noMessages.length-1
                )
            ];


        yesSize+=5;

        yes.style.fontSize =
            yesSize+"px";


        if(count>=6){

            no.style.display =
                "none";
        }
    };


    yes.onclick=()=>{

        startMusic();

        heartBurst();

        setTimeout(
            letterPage,
            700
        );
    };
}


/* =========================
   LOVE LETTER
========================= */

function letterPage(){

    app.innerHTML=`

        <div class="card">

            <div class="heart">
                💌
            </div>

            <h1>
                For You, Anjali ❤️
            </h1>

            <div class="letter">

                <p>
                    Hey Ammayi Garu... 🥺
                </p>

                <p>
                    Nuvvu naa life lo just oka
                    friend kaadu. Nuvvu naaku
                    chala special person. ❤️
                </p>

                <p>
                    Ninnu first time namminappudu
                    aa trust entha special oo
                    appudu teliyaledu.
                    Kani ippudu venakki chusthe,
                    <b>
                    nenu first genuinely trust
                    chesina person nuvve.
                    </b>
                </p>

                <p>
                    Friendship tho start ayina
                    mana bond somewhere along
                    the way naaku inka special
                    ayipoyindi.
                </p>

                <p>
                    And yes...
                    <b>
                    naa first love kuda nuvve.
                    </b>
                    ❤️
                </p>

                <p>
                    Nenu perfect person ni
                    kaakapovachu.
                    Naa feelings ni perfect ga
                    express cheyyalekapovachu.
                    Kani ninnu respect chestha,
                    trust chestha,
                    and nee presence ni
                    value chestha.
                </p>

                <p>
                    Mana madhya em jarigina,
                    mana friendship naaku
                    always special. 🫶
                </p>

                <p>
                    Ee website simple code ayina,
                    daani venakala unna feeling
                    matram genuine. ❤️
                </p>

                <p>
                    <b>
                    Thank you for being someone
                    I could trust.
                    </b>
                </p>

            </div>

            <button
                class="next"
                onclick="memoryPage()">

                One More Thing... 👉

            </button>

        </div>
    `;
}


/* =========================
   MEMORY PAGE
========================= */

function memoryPage(){

    app.innerHTML=`

        <div class="card">

            <div class="heart">
                ✨
            </div>

            <h1>
                One Little Memory...
            </h1>

            <div class="photo-box">

                <img
                    src="images/anjali1.jpeg"
                    alt="Anjali">

            </div>

            <div
                class="typing"
                id="memoryText">
            </div>

            <button
                class="next"
                onclick="secretPage()">

                There's Something Secret 🔐

            </button>

        </div>
    `;


    typing(

        document.getElementById(
            "memoryText"
        ),

        "Some people become important without even trying... and somehow, you became one of those people for me. ❤️"
    );
}


/* =========================
   SECRET PAGE
========================= */

function secretPage(){

    app.innerHTML=`

        <div class="card">

            <div class="heart">
                🔐
            </div>

            <h1>
                Secret Message
            </h1>

            <p>
                Only someone special should
                open this. 👀❤️
            </p>

            <input
                id="password"
                class="secret-input"
                type="password"
                placeholder="Enter secret word..."
            >

            <button
                class="next"
                onclick="unlock()">

                Unlock ❤️

            </button>

            <div
                class="error"
                id="error">
            </div>

            <div
                class="secret-message"
                id="secretMessage">

                <h2>
                    For Ammayi Garu 🥺❤️
                </h2>

                <p>
                    Naa life lo first genuinely
                    nammina person nuvve.
                </p>

                <p>
                    Naa first love kuda nuvve.
                </p>

                <p>
                    And the biggest thing I want
                    you to know is...
                    <b>I trust you.</b>
                    ❤️
                </p>

                <p>
                    Nuvvu naa life lo undadam
                    itself naaku oka special feeling.
                </p>

                <p>
                    Misunderstandings vachina,
                    situations change ayina,
                    mana bond ni nenu
                    value chesthune unta. 🫶
                </p>

                <button
                    class="next"
                    onclick="finalPage()">

                    One Last Surprise... 🎁

                </button>

            </div>

        </div>
    `;
}


/* =========================
   PASSWORD
========================= */

function unlock(){

    const input =
        document.getElementById(
            "password"
        );

    const error =
        document.getElementById(
            "error"
        );

    const secret =
        document.getElementById(
            "secretMessage"
        );


    if(
        input.value
        .trim()
        .toLowerCase()
        ===
        "anjali"
    ){

        error.innerText="";

        secret.style.display =
            "block";

        heartBurst();

    }else{

        error.innerText =
            "Wrong secret 😭 Try again ❤️";
    }
}


/* =========================
   FINAL PAGE
========================= */

function finalPage(){

    app.innerHTML=`

        <div class="card">

            <div class="heart">
                🎁
            </div>

            <h1>
                Your Final Surprise
            </h1>

            <p class="final">
                Ready, Ammayi Garu? 😏❤️
            </p>

            <p>
                Click the button...
                but don't blame me
                if you smile. 😂
            </p>

            <button
                class="surprise"
                onclick="openSurprise()">

                Open My Final Message 🎁

            </button>

            <div
                id="finalMessage"
                class="final-message">

                <h2>
                    ❤️ ANJALI ❤️
                </h2>

                <p>
                    If you are reading this,
                    just remember one thing...
                </p>

                <p>
                    <b>
                    You were my first trust,
                    my first love,
                    and someone I will always value.
                    </b>
                    ❤️
                </p>

                <p>
                    I don't know what the future
                    holds. But whatever happens,
                    I genuinely wish happiness
                    for you. 🫶
                </p>

                <p>
                    <b>
                    Ni istam. ❤️
                    </b>
                </p>

                <p>
                    Always.
                </p>

                <h2>
                    Thank you for being you. 🥺❤️
                </h2>

            </div>

        </div>
    `;
}


/* =========================
   FINAL SURPRISE
========================= */

function openSurprise(){

    const msg =
        document.getElementById(
            "finalMessage"
        );

    msg.style.display =
        "block";

    heartBurst();

    setTimeout(
        heartBurst,
        500
    );

    setTimeout(
        heartBurst,
        1000
    );
}


/* =========================
   HEART BURST
========================= */

function heartBurst(){

    for(let i=0;i<35;i++){

        setTimeout(()=>{

            const heart =
                document.createElement(
                    "div"
                );

            heart.className =
                "burst-heart";

            heart.innerText =
                [
                    "❤️",
                    "💖",
                    "💕",
                    "✨"
                ][
                    Math.floor(
                        Math.random()*4
                    )
                ];

            document.body.appendChild(
                heart
            );


            const x =
                (Math.random()-.5)*700;

            const y =
                (Math.random()-.5)*700;


            setTimeout(()=>{

                heart.style.transform =
                    `translate(${x}px,${y}px) scale(1.5)`;

                heart.style.opacity =
                    "0";

            },50);


            setTimeout(()=>{

                heart.remove();

            },1600);

        },i*35);
    }
}


/* =========================
   REAL MUSIC 🎵
========================= */

let playing=false;


/*
   IMPORTANT:

   Your file must be:

   music/love-song.mpeg
*/

const loveSong =
    new Audio(
        "music/love-song.mpeg"
    );

loveSong.loop=true;
loveSong.volume=.6;


/* Start music after YES */

function startMusic(){

    loveSong.play()
    .then(()=>{

        playing=true;

        musicBtn.innerText =
            "🔇 Stop Music";

    })
    .catch(()=>{

        /*
          Browser may block audio
          until user interaction.

          YES click itself is a user
          interaction, so normally
          this should work.
        */

        musicBtn.innerText =
            "🎵 Play Music";
    });
}


/* Music button */

function toggleMusic(){

    if(!playing){

        loveSong.play()
        .then(()=>{

            playing=true;

            musicBtn.innerText =
                "🔇 Stop Music";

        })
        .catch(()=>{

            alert(
                "Music play avvalante button ni malli click cheyyi ❤️"
            );
        });

    }else{

        loveSong.pause();

        playing=false;

        musicBtn.innerText =
            "🎵 Play Music";
    }
}


/* =========================
   START
========================= */

homePage();

</script>

</body>
</html>
